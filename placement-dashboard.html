<html lang="en">
<head>

<title>Placement Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#101828;--mute:#5b6678;--line:#dbe1ec;--acc:#4f46e5;--soft:#e7e6fb;--g:#16a34a;--y:#d9a006;--r:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1220;--card:#171f33;--ink:#e9eefb;--mute:#97a3bb;--line:#29334f;--acc:#8b85ff;--soft:#26264d}}
:root[data-theme="dark"]{--bg:#0d1220;--card:#171f33;--ink:#e9eefb;--mute:#97a3bb;--line:#29334f;--acc:#8b85ff;--soft:#26264d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:200px;padding:20px 12px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;flex:0 0 auto}
nav b{display:block;font:800 18px "Bricolage Grotesque",sans-serif;margin:0 8px 16px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:9px;font:600 14px Figtree,sans-serif;cursor:pointer}
nav button.on{background:var(--soft);color:var(--acc)}
main{flex:1;min-width:0;max-width:760px;padding:20px 16px 40px;margin:0 auto}
h1{font:800 26px/1.1 "Bricolage Grotesque",sans-serif;margin:0 0 14px}
h2{font:600 16px "Bricolage Grotesque",sans-serif;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.grid .card{margin:0}.big{font:800 28px/1 "Bricolage Grotesque",sans-serif}.mute{color:var(--mute);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
label.t{display:flex;gap:10px;align-items:flex-start;flex:1;cursor:pointer}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);margin-top:2px;flex:0 0 auto}
input:checked+span{color:var(--mute);text-decoration:line-through}
button.b,input.i,select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}input.i{cursor:text;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips button{width:34px;height:34px;padding:0}
.chips button.d{background:var(--acc);color:#fff;border-color:var(--acc)}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;background:var(--line)}
.bars{display:flex;gap:6px;align-items:flex-end;height:70px}.bars div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:3px}
.rec{padding:8px 12px;background:var(--soft);border-radius:9px;margin-bottom:6px}
details.card>summary{cursor:pointer;font-weight:600}a{color:var(--acc)}
@media(max-width:720px){body{display:block}nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;display:flex;overflow-x:auto;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);background:var(--card);z-index:5}
nav b{display:none}nav button{width:auto;white-space:nowrap}main{padding-bottom:90px}}
</style>
</head>

<main id="main"></main>

var S={start:new Date().setHours(0,0,0,0),page:"Dashboard",sel:null,done:{},cus:{},dsa:{},log:[],rev:{},chk:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem("pp6")||"{}"))}catch(e){}

function mw(N){return[Math.floor((N-1)/30),Math.min(3,Math.floor(((N-1)%30)/7))]}
function tasks(N){var a=mw(N),m=M[a[0]],T=m[2][a[1]];

function ring(p){var c=2*Math.PI*34;return'<svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="42" cy="42" r="34" fill="none" stroke="var(--acc)" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+c*(1-p/100)+'" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">'+Math.round(p)+'%</text></svg>'}

for(i=1;i<=N;i++){var s=stat(i);sd+=s[0];st+=s[1]}
var rate=st?sd/st*100:0,solved=0,tot=0;DS.forEach(function(x){solved+=Math.min(S.dsa[x[0]]||0,x[1]);tot+=x[1]});
var ck=chkAll(),ckp=ck[0]/ck[1]*100,dp=solved/tot*100,ready=Math.round(.4*dp+.3*rate+.3*ckp);
var strk=0,j=N;if(stat(j)[0]==0)j--;while(j>=1&&stat(j)[0]>0){strk++;j--}
var idle=0;for(j=N;j>=1&&stat(j)[0]==0;j--)idle++;
var weak=RV.filter(function(x){return S.rev[x]=="r"||S.rev[x]=="y"}),rec=[];
if(idle>=3)rec.push("No tasks done for "+idle+" days. Do just one task today to restart.");

'<div class="grid"><div class="card"><div class="big">'+ts[0]+'/'+ts[1]+'</div><div class="mute">Today\'s tasks done</div>'+bar(ts[1]?ts[0]/ts[1]*100:0)+'</div><div class="card"><div class="big">'+solved+'/'+tot+'</div><div class="mute">DSA problems solved</div>'+bar(dp)+'</div><div class="card"><div class="big">'+strk+'</div><div class="mute">Day streak</div></div><div class="card"><div class="big">'+ready+'%</div><div class="mute">Readiness score</div>'+bar(ready)+'</div></div>'+

m[2].forEach(function(t,w){var c="",n=w==3?9:7;for(var d=0;d<n;d++){var N=mi*30+w*7+d+1,s=stat(N);c+='<button class="b'+(s[0]==s[1]&&s[1]?" d":"")+'" data-a="go" data-n="'+N+'">'+N+'</button>'}

return h}
function dsaP(){var h='<h1>DSA tracker</h1><div class="card"><h2>Today\'s DSA</h2>Solve '+M[mw(dn())[0]][3]+' problem(s) on <b>'+nextDs()+'</b>.<div class="mute">Flow per topic: learn, solve easy problems, solve timed ones, then revise your mistakes.</div></div><div class="card"><h2>What to practice where</h2>';
PL.forEach(function(p){h+='<div class="row"><div class="grow"><a href="'+p[1]+'" target="_blank" rel="noopener">'+p[0]+'</a><div class="mute">'+p[2]+'</div></div></div>'});h+='</div><div class="card"><h2>Topics</h2>';
DS.forEach(function(x){var v=S.dsa[x[0]]||0;h+='<div class="row"><div class="grow"><b>'+x[0]+'</b> <span class="mute">'+v+'/'+x[1]+' (about 40% easy, 60% medium)</span>'+bar(v/x[1]*100)+'</div><button class="b" data-a="ds" data-t="'+x[0]+'" data-d="-1">-</button><button class="b" data-a="ds" data-t="'+x[0]+'" data-d="1">+</button></div>'});
h+='</div><div class="card"><h2>Mistake log</h2><input class="i" id="lp" placeholder="Problem name"><input class="i" id="lm" placeholder="My mistake" style="margin-top:6px"><input class="i" id="lc" placeholder="Correct approach" style="margin-top:6px"><div style="margin-top:6px"><select id="lt">'+DS.map(function(x){return'<option>'+x[0]+'</option>'}).join("")+'</select> <select id="ld"><option>Easy</option><option>Medium</option><option>Hard</option></select> <button class="b p" data-a="lg">Save</button></div>';

function chk(){var h='<h1>Checklists</h1><p class="mute">Use AI tools to explain code, then rewrite it yourself. If you cannot explain a line, do not submit it.</p>';

function sett(){var d=new Date(S.start),v=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);return'<h1>Settings</h1><div class="card"><h2>Start date (Day 1)</h2><input class="i" type="date" id="sd" value="'+v+'" style="width:auto"> <button class="b p" data-a="sd">Save</button></div><div class="card"><h2>Backup and theme</h2><div class="mute">Your data lives only in this browser on this device, including certificate files. It will not appear on another device unless you export a backup and restore it there. Sharing this page link does not share your data.</div><div style="margin-top:8px"><button class="b" data-a="exp">Export backup</button> <button class="b" data-a="th">Switch light/dark</button></div><div class="mute" style="margin-top:8px">Restore from a backup file:</div><input type="file" id="imp" accept=".json"></div><div class="card"><button class="b" data-a="rs">Reset all progress</button></div>'}

h+='<div class="card"><h2>Strengths and weaknesses</h2><b>Top 3 strengths:</b> '+top.join(", ")+'<br><b>Top 3 weaknesses:</b> '+low.join(", ")+'<div class="mute" style="margin-top:6px">Next: raise '+low.map(function(x){return x+" to at least "+Math.min(100,q[x]+25)+"%"}).join("; ")+'. Rate topics on the Revision page and log your practice so these numbers stay honest.</div></div>';

function val(i){return document.getElementById(i).value.trim()}
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b||b.type=="checkbox")return;var a=b.dataset.a,N=S.sel||dn(),i=+b.dataset.i;
if(a=="lgs"){lgSave(b.dataset.k);return}
if(a=="lge"){S.edit={k:b.dataset.k,i:i};render();window.scrollTo(0,0);return}
if(a=="lgd"){if(confirm("Delete this entry?")){S[b.dataset.k].splice(i,1);render()}return}
if(a=="pv"){var pk=b.dataset.k+i;S.pv=S.pv==pk?null:pk;render();return}
if(a=="dl"){var it=S[b.dataset.k][i];dlSave(it.fn||"file",d2b(it.file));return}
if(a=="flt"){S.flt=b.dataset.f;render();return}

else if(a=="go"){S.sel=+b.dataset.n;S.page="Today"}
else if(a=="nav"){var d=+b.dataset.d;S.sel=d?Math.min(180,Math.max(1,N+d)):null}

else if(a=="dl")S.cus[N].splice(i,1);

else if(a=="lg"){if(!val("lp"))return;S.log.unshift({p:val("lp"),m:val("lm"),c:val("lc"),t:val("lt"),f:val("ld"),d:new Date().toISOString().slice(0,10)})}
else if(a=="ll")S.log.splice(i,1);
else if(a=="rv"){var o=[undefined,"g","y","r"],c=o.indexOf(S.rev[b.dataset.t]);S.rev[b.dataset.t]=o[(c+1)%4]}
else if(a=="sd"){var v=document.getElementById("sd").value;if(v)S.start=new Date(v+"T00:00:00").getTime()}
else if(a=="rs"){if(confirm("Clear all progress?")){S={start:new Date().setHours(0,0,0,0),page:"Dashboard",sel:null,done:{},cus:{},dsa:{},log:[],rev:{},chk:{},apt:[],mock:[],sk:{},cert:[],ev:[],hk:[],ws:[],job:[]}}}
else if(a=="ap"){var q=+val("aa"),r2=Math.min(q,+val("ac"));if(!(q>0))return;S.apt.unshift({c:val("aq"),a:q,r:r2,m:+val("am")||0,w:val("aw"),d:new Date().toISOString().slice(0,10)})}
else if(a=="al")S.apt.splice(i,1);
else if(a=="ma"){var sc=Math.max(0,Math.min(10,+val("ms")));S.mock.unshift({t:val("mt"),s:sc,n:val("mn"),d:new Date().toISOString().slice(0,10)})}
else if(a=="ml")S.mock.splice(i,1);
else if(a=="sk")S.sk[b.dataset.t]=Math.max(0,Math.min(100,(S.sk[b.dataset.t]||0)+ +b.dataset.d));
render();window.scrollTo(0,0)});

if(a=="tk")S.done[N+"-"+c.dataset.i]=c.checked;else if(a=="ck")S.cus[N][+c.dataset.i].d=c.checked;else if(a=="cl")S.chk[c.dataset.k]=c.checked;
var y=window.scrollY;render();window.scrollTo(0,y)});
